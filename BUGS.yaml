bugs:
  - id: BUG-001
    title: Concurrent Postgres cold starts collide during table creation
    severity: high
    status: fixed
    evidence: Synchronized eight real connections reproduced pg_type unique violation
    fix: Transaction-scoped advisory lock serializes schema initialization
    regression: tests/backend/test_postgres.py
  - id: BUG-002
    title: Lesson source URI format is rejected by provider structured output
    severity: high
    status: fixed
    evidence: Hosted authoring returned HTTP 400; corrected schema passed request admission
    fix: Provider-specific schema copy omits unsupported URI format; domain URL validation remains
    regression: tests/backend/test_provider.py
  - id: BUG-003
    title: Full lesson authoring exceeds the original 100 second request deadline
    severity: high
    status: fixed
    evidence: Hosted authoring failed after 100 seconds with unknown provider billing
    fix: Configure low reasoning and 210 second provider deadline within the 240 second lease
    regression: tests/backend/test_queue_settings.py; complete live generation passed
  - id: BUG-004
    title: Appliance explanations lack visible component labels and beginner causal staging
    severity: high
    status: open
    evidence: Human review of AC screenshots finds unlabeled narrated parts and confusing four-stage cycle
    fix: CE-1 causal insets, shared media, prediction/transfer and evidence gates deployed for protected review; independent technical, actual-phone and beginner acceptance pending
    regression: tests/backend/test_learning_quality.py; docs/QUALITY-BAR.md
  - id: BUG-005
    title: SVG rasterizer frame dimensions corrupt raw MP4 timing
    severity: high
    status: fixed
    evidence: Real encoder regression shortened a 15 second storyboard when resvg returned fewer rows
    fix: Fit and pad every rasterized frame to the exact configured byte dimensions
    regression: tests/backend/test_pipeline.py; tests/backend/test_teaching.py
  - id: BUG-006
    title: CE-1 production generation lacks a completed end-to-end benchmark
    severity: high
    status: open
    evidence: Combined author timeout, full-copy review cap, clipped labels and author output cap observed
    fix: Evidence checkpoint, compact author transport and SHA-bound review; hosted end-to-end evaluation pending
    regression: tests/backend/test_research.py; tests/backend/test_pipeline.py; ADR 0002
