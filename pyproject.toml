[project]
name = "inside-machines-alpha"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.149.0", "uvicorn==0.54.0", "httpx==0.28.1", "pydantic==2.14.1",
  "pyyaml==6.0.3", "python-dotenv==1.2.4", "pillow==13.0.0", "imageio-ffmpeg==0.6.0",
  "psycopg[binary]==3.3.6", "vercel-blob==0.5.0", "vercel-queue==0.9.2", "vercel==0.12.0",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "main:app"

[tool.vercel.fastapi.static]
# Only the public shell is mounted; all protected data lives under /api/v1.
cdn = true

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["vendor", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "vendor/workspace_shared"
exclude = ["vendor", ".venv"]

[[tool.mypy.overrides]]
# Preserve upstream source unchanged; enforce strict checking on project adapters.
module = ["_shared.services.model_gateway.backend_llamacpp", "_shared.services.model_gateway.gateway"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.coverage.run]
source = ["backend"]

[[tool.vercel.subscribers]]
entrypoint = "backend.tasks"
